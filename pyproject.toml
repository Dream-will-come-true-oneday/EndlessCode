[project]
name = "endless-code"
version = "0.1.0"
description = "CLI AI assistant with streaming multi-turn conversation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "textual>=0.52,<9",
    "rich>=13.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.scripts]
endless-code = "endless_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/endless_code"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# ruff 0.16 起 format 会重排 Markdown 中的 Python 代码块。docs 下的 spec/plan/task
# 大量使用类体内缩进片段作为实现契约，重排后会变成带 self 的模块级函数，
# 误导按文档实现的人，故把 docs 排除；src、tests、examples 仍全量受检。
extend-exclude = ["docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
