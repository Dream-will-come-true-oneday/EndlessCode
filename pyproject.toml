[project]
name = "endless-code"
version = "0.1.0"
description = "CLI AI assistant with streaming multi-turn conversation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "textual>=0.52,<9",
    "rich>=13.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.scripts]
endless-code = "endless_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/endless_code"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 把仓库根加入 sys.path，使 tests 内的 from tests.xxx import 绝对导入
# 在任何调用方式下（python -m pytest 与裸 pytest）都与 CI 一致。
pythonpath = ["."]
# 评测体系的严格 marker 声明与覆盖率门槛（合入自 archive/eval-system）。
addopts = "--strict-markers"
markers = [
    "unit: 纯函数/状态机单元测试",
    "integration: 模块组合集成测试",
    "e2e: 端到端场景测试（FakeLLM 驱动）",
    "stability: 失败注入稳定性测试",
    "perf: 性能/成本基线测试",
    "eval: 真实模型评测（需要 API key，默认跳过）",
]

[tool.coverage.run]
source = ["endless_code"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
# ruff 0.16 起 format 会重排 Markdown 中的 Python 代码块。docs 下的 spec/plan/task
# 大量使用类体内缩进片段作为实现契约，重排后会变成带 self 的模块级函数，
# 误导按文档实现的人，故把 docs 排除；src、tests、examples 仍全量受检。
extend-exclude = ["docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
