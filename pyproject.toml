[project]
name = "endless-code"
version = "0.1.0"
description = "CLI AI assistant with streaming multi-turn conversation"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.52,<9",
    "rich>=13.0",
    "openai>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
endless-code = "endless_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/endless_code"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
