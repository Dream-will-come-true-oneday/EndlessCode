[project]
name = "endless-code"
version = "0.1.0"
description = "CLI AI assistant with streaming multi-turn conversation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "textual>=0.52,<9",
    "rich>=13.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.scripts]
endless-code = "endless_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/endless_code"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "unit: 纯函数/状态机单元测试",
    "integration: 模块组合集成测试",
    "e2e: 端到端场景测试（FakeLLM 驱动）",
    "stability: 失败注入稳定性测试",
    "perf: 性能/成本基线测试",
    "eval: 真实模型评测（需要 API key，默认跳过）",
]

[tool.coverage.run]
source = ["endless_code"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
