# Endless Code MCP 服务器配置示例
#
# 复制本文件内容到以下任一位置（优先级从低到高，同名 server 项目级完整覆盖用户级）：
#   1. ~/.config/endless-code/mcp.yaml          （用户级）
#   2. .endless-code/mcp.yaml                   （项目级）
#
# env / headers 的值支持 ${VAR} 从宿主环境变量展开；command / args 不展开。
# 未定义的环境变量展开为空串 + stderr 一次性告警，不阻断启动。
#
# 连接失败 / 配置非法 / 超时的 server 会被跳过，其余 server 与内置工具照常可用。

mcp_servers:
  # GitHub MCP - 代码仓库管理
  github:
    type: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"          # 从宿主环境展开，密钥不入配置

  # SQLite MCP - 本地数据库访问
  local-sqlite:
    type: stdio
    command: python
    args: ["-m", "mcp_server_sqlite", "--db", "./data.db"]

  # HTTP MCP - 自定义 HTTP 端点
  example-http:
    type: http
    url: "https://mcp.example.com/mcp"
    headers:
      Authorization: "Bearer ${EXAMPLE_TOKEN}"  # 自定义 HTTP 头，也支持 ${VAR}

# 使用提示:
# 1. 先设置环境变量：export GITHUB_TOKEN=ghp_xxx (Linux/Mac) 或 $env:GITHUB_TOKEN="ghp_xxx"(PowerShell)
# 2. 复制到用户级配置：cp docs/mcp/mcp-servers.example.yaml ~/.config/endless-code/mcp.yaml
# 3. 或直接复制到项目级：cp docs/mcp/mcp-servers.example.yaml .endless-code/mcp.yaml
# 4. 重启 endless-code 即可自动加载
