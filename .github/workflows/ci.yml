name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # 与本地开发环境对齐，避免格式/测试工具版本漂移
          python -m pip install ruff==0.16.0 pytest==8.3.4 pytest-asyncio==0.25.0

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Compile check
        run: python -m compileall -q src examples

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test (needs provider key)
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p .endless-code
          cat > .endless-code/config.yaml <<'EOF'
          providers:
            - name: openai
              protocol: openai
              model: gpt-4o
              api_key: $OPENAI_API_KEY
          EOF
          python examples/smoke.py --provider openai
